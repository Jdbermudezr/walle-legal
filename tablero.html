<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08150F">
<title>Walle · Mi tablero</title>
<style>
:root{
  --bg:#08150F; --bg2:#0C1E16; --card:#112A20; --card2:#16362A;
  --line:#1E4534; --ink:#EAF6EF; --ink2:#A9C6B7; --ink3:#6E8C7E;
  --in:#1FA36A; --out:#D1603D; --acc:#7CE3A1;
  --r:18px; --sp:16px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
  min-height:100dvh;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 40px);
  background-image:radial-gradient(120% 60% at 50% -12%, #123D2B 0%, transparent 62%);
}
.wrap{max-width:720px;margin:0 auto}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,var(--acc),#2FB87A);
  display:grid;place-items:center;font-size:20px;flex:none;box-shadow:var(--shadow)}
.hi{flex:1;min-width:0}
.hi h1{font-size:19px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi p{font-size:12.5px;color:var(--ink3);margin-top:2px}
.chip{font-size:11px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--card2);color:var(--acc);
  border:1px solid var(--line);white-space:nowrap}

/* ---------- filtros ---------- */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.f{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:13px;font-weight:600;
  padding:9px 14px;border-radius:99px;cursor:pointer;transition:.15s}
.f:hover{border-color:#2A5F48}
.f[aria-pressed="true"]{background:var(--acc);color:#06130D;border-color:var(--acc)}

/* ---------- kpis ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi.wide{grid-column:1/-1}
.kpi .lbl{font-size:11.5px;color:var(--ink3);font-weight:600;letter-spacing:.3px;text-transform:uppercase;
  display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:3px;flex:none}
.kpi .val{font-size:24px;font-weight:800;letter-spacing:-.8px;margin-top:8px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--ink3);margin-top:4px}
.pos{color:var(--acc)} .neg{color:#F0876A}

/* ---------- card ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{font-size:14px;font-weight:700;margin-bottom:2px}
.card .cap{font-size:12px;color:var(--ink3);margin-bottom:14px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-bottom:10px}
.legend span{display:flex;align-items:center;gap:6px}

svg.chart{display:block;width:100%;height:210px;overflow:visible}
.gridline{stroke:var(--line);stroke-width:1}
.axis{fill:var(--ink3);font-size:11px}
.barlbl{font-size:11px;font-weight:700}
rect.bar{transition:opacity .15s}
g.grp:hover rect.bar{opacity:.55}
g.grp:hover rect.bar.on{opacity:1}

/* ---------- categorias ---------- */
.cat{display:flex;align-items:center;gap:10px;padding:9px 0;cursor:pointer;border-bottom:1px solid rgba(30,69,52,.5)}
.cat:last-child{border-bottom:0}
.cat .nm{font-size:13.5px;font-weight:600;width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .track{flex:1;height:10px;border-radius:99px;background:#0D2318;overflow:hidden}
.cat .fill{height:100%;border-radius:99px}
.cat .amt{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.cat[aria-selected="true"]{background:rgba(124,227,161,.07);border-radius:10px;padding-left:8px;padding-right:8px}

/* ---------- movimientos ---------- */
.search{width:100%;background:#0D2318;border:1px solid var(--line);color:var(--ink);border-radius:12px;
  padding:11px 13px;font-size:14px;margin-bottom:12px;font-family:inherit}
.search::placeholder{color:var(--ink3)}
.search:focus{outline:none;border-color:var(--acc)}
.mv{border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden;background:#0E241A}
.mv summary{list-style:none;display:flex;align-items:center;gap:11px;padding:12px 13px;cursor:pointer}
.mv summary::-webkit-details-marker{display:none}
.ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:15px;flex:none}
.mv .t{flex:1;min-width:0}
.mv .t b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .t small{color:var(--ink3);font-size:11.5px}
.mv .v{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.det{padding:0 13px 13px 58px;display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px}
.det dt{color:var(--ink3)} .det dd{color:var(--ink2)}
.more{width:100%;border:1px dashed var(--line);background:transparent;color:var(--ink2);border-radius:12px;
  padding:11px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}

/* ---------- estados ---------- */
.center{text-align:center;padding:40px 20px}
.center .big{font-size:44px;margin-bottom:10px}
.center h2{font-size:19px;margin-bottom:8px}
.center p{color:var(--ink2);font-size:14.5px;line-height:1.5;max-width:360px;margin:0 auto}
.btn{display:inline-block;margin-top:18px;background:var(--acc);color:#06130D;border:0;border-radius:12px;
  padding:13px 22px;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;font-family:inherit}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;
  margin:0 auto 16px;animation:s .9s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.note{text-align:center;color:var(--ink3);font-size:11.5px;margin-top:14px;line-height:1.5}
.empty{text-align:center;color:var(--ink3);font-size:13.5px;padding:22px 0}
@media(min-width:560px){ .kpis{grid-template-columns:repeat(3,1fr)} .kpi.wide{grid-column:auto} }
</style>
</head>
<body data-palette="#1FA36A,#D1603D">
<div class="wrap" id="app">
  <div class="center"><div class="spin"></div><p>Cargando tu tablero…</p></div>
</div>

<script>
const API='https://fnolzmacqnaxcktlxhxx.supabase.co/functions/v1/tablero';
const WA='https://wa.me/16292475517';
const PLANES='https://walle-drab.vercel.app/';
const $=document.getElementById('app');
const T=new URLSearchParams(location.search).get('t');

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=(n,m)=>new Intl.NumberFormat('es-CO',{style:'currency',currency:m||'COP',maximumFractionDigits:0}).format(n);
const corto=n=>{const a=Math.abs(n);
  if(a>=1e9)return (n/1e9).toFixed(1).replace('.0','')+'B';
  if(a>=1e6)return (n/1e6).toFixed(1).replace('.0','')+'M';
  if(a>=1e3)return Math.round(n/1e3)+'k'; return String(Math.round(n));};
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fechaLarga=f=>{const [y,m,d]=f.split('-').map(Number);return `${d} ${MES[m-1]} ${y}`;};

function pantalla(icono,titulo,texto,botones){
  $.innerHTML=`<div class="center"><div class="big">${icono}</div><h2>${esc(titulo)}</h2>
    <p>${esc(texto)}</p><div class="foot">${botones||''}</div></div>`;
}

/* ================= estado ================= */
const S={data:null,rango:'mes',moneda:'COP',cat:null,q:'',tope:12};

function rangoFechas(k){
  const hoy=new Date(), y=hoy.getFullYear(), m=hoy.getMonth();
  const iso=d=>d.toISOString().slice(0,10);
  if(k==='mes')    return [iso(new Date(Date.UTC(y,m,1))),  iso(new Date(Date.UTC(y,m+1,0)))];
  if(k==='pasado') return [iso(new Date(Date.UTC(y,m-1,1))),iso(new Date(Date.UTC(y,m,0)))];
  if(k==='90')     return [iso(new Date(Date.UTC(y,m-2,1))),iso(new Date(Date.UTC(y,m+1,0)))];
  return ['','9999-12-31'];
}
function filtrados(){
  const [a,b]=rangoFechas(S.rango);
  return S.data.movimientos.filter(m=>
    m.moneda===S.moneda && (!a||m.fecha>=a) && m.fecha<=b &&
    (!S.cat||m.categoria===S.cat) &&
    (!S.q||(m.comercio+' '+m.descripcion+' '+m.categoria+' '+m.evento).toLowerCase().includes(S.q))
  );
}

/* ================= gráficos ================= */
// Barras agrupadas por mes. Dos series: identidad reforzada con leyenda,
// etiqueta directa del total y flecha en el tooltip, no solo color.
function chartMeses(movs){
  const map=new Map();
  for(const m of movs){
    const k=m.fecha.slice(0,7);
    const o=map.get(k)||{in:0,out:0};
    o[m.tipo==='ingreso'?'in':'out']+=m.valor;
    map.set(k,o);
  }
  const keys=[...map.keys()].sort().slice(-6);
  if(!keys.length) return '<div class="empty">Sin movimientos en este periodo.</div>';
  const max=Math.max(...keys.map(k=>Math.max(map.get(k).in,map.get(k).out)))||1;
  // Lienzo en px reales: el texto no crece con el ancho de la pantalla.
  const W=340,H=180,pad=22,base=138,alto=96;
  const gw=(W-pad*2)/keys.length, bw=Math.min(30,gw/2.8), sep=3;
  let g='';
  keys.forEach((k,i)=>{
    const o=map.get(k), cx=pad+gw*i+gw/2;
    const hi=Math.max(3,o.in/max*alto), ho=Math.max(3,o.out/max*alto);
    const [yy,mm]=k.split('-'); const bal=o.in-o.out;
    g+=`<g class="grp">
      <title>${MES[+mm-1]} ${yy}\n↑ ingresos ${nf(o.in,S.moneda)}\n↓ gastos ${nf(o.out,S.moneda)}</title>
      <rect x="${cx-gw/2}" y="20" width="${gw}" height="${base-20}" fill="transparent"/>
      <rect class="bar on" x="${cx-bw-sep/2}" y="${base-hi}" width="${bw}" height="${hi}" rx="4" fill="var(--in)"/>
      <rect class="bar on" x="${cx+sep/2}" y="${base-ho}" width="${bw}" height="${ho}" rx="4" fill="var(--out)"/>
      <text class="axis" x="${cx}" y="${base+15}" text-anchor="middle">${MES[+mm-1]}</text>
      <text class="barlbl" x="${cx}" y="${base-Math.max(hi,ho)-7}" text-anchor="middle"
        fill="${bal>=0?'var(--acc)':'#F0876A'}">${bal>=0?'+':'−'}${corto(Math.abs(bal))}</text>
    </g>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"
     role="img" aria-label="Ingresos y gastos por mes">
    <line class="gridline" x1="${pad-6}" y1="${base}" x2="${W-pad+6}" y2="${base}"/>${g}</svg>`;
}
// Magnitud por categoría: un solo hue, intensidad proporcional (escala secuencial).
function chartCategorias(movs){
  const map=new Map();
  for(const m of movs){ if(m.tipo!=='egreso')continue;
    map.set(m.categoria,(map.get(m.categoria)||0)+m.valor); }
  const arr=[...map.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8);
  if(!arr.length) return '<div class="empty">Aún no hay gastos que mostrar.</div>';
  const max=arr[0][1];
  return arr.map(([c,v])=>{
    const p=Math.max(5,v/max*100), op=(0.45+0.55*(v/max)).toFixed(2);
    const sel=S.cat===c;
    return `<div class="cat" data-cat="${esc(c)}" role="button" tabindex="0" aria-selected="${sel}">
      <div class="nm">${esc(c)}</div>
      <div class="track"><div class="fill" style="width:${p}%;background:var(--in);opacity:${op}"></div></div>
      <div class="amt">${nf(v,S.moneda)}</div></div>`;
  }).join('');
}

/* ================= movimientos ================= */
function listaMovs(movs){
  if(!movs.length) return '<div class="empty">Nada por aquí con esos filtros.</div>';
  const vis=movs.slice(0,S.tope);
  const html=vis.map(m=>{
    const ing=m.tipo==='ingreso';
    const tit=m.comercio||m.descripcion||m.categoria;
    return `<details class="mv"><summary>
      <div class="ic" style="background:${ing?'rgba(31,163,106,.18)':'rgba(209,96,61,.18)'};color:${ing?'var(--acc)':'#F0876A'}">${ing?'↑':'↓'}</div>
      <div class="t"><b>${esc(tit)}</b><small>${fechaLarga(m.fecha)} · ${esc(m.categoria)}</small></div>
      <div class="v" style="color:${ing?'var(--acc)':'#F0876A'}">${ing?'+':'−'}${nf(m.valor,m.moneda)}</div>
      </summary>
      <dl class="det">
        <dt>Tipo</dt><dd>${ing?'Ingreso':'Gasto'}</dd>
        <dt>Categoría</dt><dd>${esc(m.categoria)}</dd>
        ${m.evento&&m.evento!=='Diario'?`<dt>Evento</dt><dd>${esc(m.evento)}</dd>`:''}
        ${m.descripcion?`<dt>Detalle</dt><dd>${esc(m.descripcion)}</dd>`:''}
        ${m.medio?`<dt>Medio</dt><dd>${esc(m.medio)}</dd>`:''}
        ${m.hora?`<dt>Hora</dt><dd>${esc(m.hora)}</dd>`:''}
      </dl></details>`;
  }).join('');
  const resto=movs.length-vis.length;
  return html+(resto>0?`<button class="more" id="more">Ver ${resto} movimiento${resto===1?'':'s'} más</button>`:'');
}

/* ================= render ================= */
function render(){
  const d=S.data, movs=filtrados();
  const catBase=(()=>{const c=S.cat;S.cat=null;const r=filtrados();S.cat=c;return r;})();
  const ing=movs.filter(m=>m.tipo==='ingreso').reduce((s,m)=>s+m.valor,0);
  const egr=movs.filter(m=>m.tipo==='egreso').reduce((s,m)=>s+m.valor,0);
  const bal=ing-egr;
  const monedas=[...new Set(d.movimientos.map(m=>m.moneda))];
  const nom=(d.nombre||'').split(/\s+/)[0]||'';
  const chip=d.ilimitado?'Ilimitado':`${d.vistas_restantes} vista${d.vistas_restantes===1?'':'s'}`;
  const rangos=[['mes','Este mes'],['pasado','Mes pasado'],['90','3 meses'],['todo','Todo']];

  $.innerHTML=`
  <header>
    <div class="logo">🐷</div>
    <div class="hi"><h1>${nom?'Hola, '+esc(nom):'Tu tablero'}</h1>
      <p>${movs.length} movimiento${movs.length===1?'':'s'} en vista</p></div>
    <span class="chip">${chip}</span>
  </header>

  <div class="filters">
    ${rangos.map(([k,l])=>`<button class="f" data-r="${k}" aria-pressed="${S.rango===k}">${l}</button>`).join('')}
    ${monedas.length>1?monedas.map(m=>`<button class="f" data-m="${m}" aria-pressed="${S.moneda===m}">${m}</button>`).join(''):''}
    ${S.cat?`<button class="f" id="clearcat" aria-pressed="true">${esc(S.cat)} ✕</button>`:''}
  </div>

  <div class="kpis">
    <div class="kpi"><div class="lbl"><i class="dot" style="background:var(--in)"></i>Ingresos</div>
      <div class="val pos">${nf(ing,S.moneda)}</div></div>
    <div class="kpi"><div class="lbl"><i class="dot" style="background:var(--out)"></i>Gastos</div>
      <div class="val neg">${nf(egr,S.moneda)}</div></div>
    <div class="kpi wide"><div class="lbl">Balance</div>
      <div class="val ${bal>=0?'pos':'neg'}">${bal>=0?'+':'−'}${nf(Math.abs(bal),S.moneda)}</div>
      <div class="sub">${egr>0&&ing>0?`Gastaste el ${Math.round(egr/ing*100)}% de lo que entró`:'&nbsp;'}</div></div>
  </div>

  <div class="card">
    <h2>Mes a mes</h2><p class="cap">Últimos 6 meses con movimiento. El número es tu balance.</p>
    <div class="legend">
      <span><i class="dot" style="background:var(--in)"></i>Ingresos</span>
      <span><i class="dot" style="background:var(--out)"></i>Gastos</span>
    </div>
    ${chartMeses(S.cat?S.data.movimientos.filter(m=>m.moneda===S.moneda):movs)}
  </div>

  <div class="card">
    <h2>En qué se te va</h2><p class="cap">Toca una categoría para filtrar tus movimientos.</p>
    ${chartCategorias(catBase)}
  </div>

  <div class="card">
    <h2>Movimientos</h2><p class="cap">Toca uno para ver el detalle completo.</p>
    <input class="search" id="q" placeholder="Buscar comercio, categoría o evento…" value="${esc(S.q)}">
    ${listaMovs(movs)}
  </div>

  <div class="foot">
    <a class="btn ghost" href="${esc(d.sheet_url)}" target="_blank" rel="noopener">Abrir mi hoja</a>
    <a class="btn" href="${WA}">Volver a WhatsApp</a>
  </div>
  ${d.ilimitado?'':`<p class="note">Te quedan ${d.vistas_restantes} vistas gratis del tablero.<br>
     Con un plan activo lo abres sin límite.</p>`}
  <p class="note">Tus datos viven en tu propia hoja de Google Drive.</p>`;

  $.querySelectorAll('.f[data-r]').forEach(b=>b.onclick=()=>{S.rango=b.dataset.r;S.tope=12;render()});
  $.querySelectorAll('.f[data-m]').forEach(b=>b.onclick=()=>{S.moneda=b.dataset.m;S.tope=12;render()});
  const cc=document.getElementById('clearcat'); if(cc)cc.onclick=()=>{S.cat=null;render()};
  $.querySelectorAll('.cat').forEach(el=>{
    const pick=()=>{S.cat=S.cat===el.dataset.cat?null:el.dataset.cat;S.tope=12;render()};
    el.onclick=pick; el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick()}};
  });
  const more=document.getElementById('more'); if(more)more.onclick=()=>{S.tope+=20;render()};
  const q=document.getElementById('q');
  if(q){ q.oninput=()=>{S.q=q.value.trim().toLowerCase();S.tope=12;render();
    const n=document.getElementById('q'); if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);} }; }
}

/* ================= arranque ================= */
(async()=>{
  if(!T) return pantalla('🔒','Abre tu tablero desde WhatsApp',
    'Escríbele «tablero» a Walle y te manda tu enlace personal.',
    `<a class="btn" href="${WA}">Ir a WhatsApp</a>`);
  let d;
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({t:T})});
    d=await r.json();
  }catch(e){
    return pantalla('⚠️','No pudimos conectar','Revisa tu internet e intenta de nuevo.',
      `<button class="btn" onclick="location.reload()">Reintentar</button>`);
  }
  if(!d.ok){
    if(d.error==='sin_vistas') return pantalla('✨','Se acabaron tus vistas gratis',
      'Con un plan activo abres tu tablero cuando quieras, sin contador.',
      `<a class="btn" href="${PLANES}?t=${encodeURIComponent(T)}">Ver planes</a>
       <a class="btn ghost" href="${WA}">Volver a WhatsApp</a>`);
    if(d.error==='sin_google') return pantalla('🔗','Falta conectar tu Drive',
      'Conecta tu Google Drive desde WhatsApp y vuelve a abrir el tablero.',
      `<a class="btn" href="${WA}">Ir a WhatsApp</a>`);
    if(d.error==='enlace_vencido') return pantalla('⏳','Tu enlace venció',
      'Escríbele «tablero» a Walle y te manda uno nuevo.',
      `<a class="btn" href="${WA}">Pedir enlace nuevo</a>`);
    return pantalla('⚠️','Algo salió mal', d.mensaje||'Intenta de nuevo en un momento.',
      `<button class="btn" onclick="location.reload()">Reintentar</button>`);
  }
  if(!d.movimientos.length) return pantalla('🌱','Tu tablero está listo',
    'Registra tu primer gasto en WhatsApp y aquí verás tus números.',
    `<a class="btn" href="${WA}">Registrar mi primer gasto</a>`);
  S.data=d;
  const cuenta={};
  d.movimientos.forEach(m=>cuenta[m.moneda]=(cuenta[m.moneda]||0)+1);
  S.moneda=Object.entries(cuenta).sort((a,b)=>b[1]-a[1])[0][0];
  render();
})();
</script>
</body>
</html>
