<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F4EE">
<title>Walle · Mi tablero</title>
<style>
/* ============ tokens ============ */
:root{
  --bg:#F6F4EE; --bg2:#EFEBE1; --surf:#FFFFFF; --surf2:#FBF9F4;
  --line:#E4DED0; --line2:#D6CDB9;
  --ink:#16221C; --ink2:#5A6B62; --ink3:#8D9A92;
  --in:#1B7A46; --out:#D9A13B;          /* validado modo claro */
  --brand:#16603F; --gold:#C9A227;
  --tint:rgba(27,122,70,.08);
  --sh-s:0 1px 2px rgba(22,34,28,.05), 0 2px 8px rgba(22,34,28,.04);
  --sh-m:0 2px 4px rgba(22,34,28,.05), 0 12px 28px rgba(22,34,28,.07);
  --sh-in:inset 0 1px 0 rgba(255,255,255,.7);
  --grad:linear-gradient(160deg,#FFFFFF 0%,#FBF8F1 100%);
  --grad-brand:linear-gradient(145deg,#1E8A50 0%,#12543A 100%);
  --r:20px; --r2:14px;
}
html[data-theme="dark"]{
  --bg:#0F1113; --bg2:#171A1D; --surf:#1A1E21; --surf2:#202528;
  --line:#2A3034; --line2:#3A4248;
  --ink:#ECEFF1; --ink2:#A3ADB3; --ink3:#727E85;
  --in:#2E9E63; --out:#B8862A;          /* validado sobre superficie carbon */
  --brand:#3DB87A; --gold:#D3A748;
  --tint:rgba(46,158,99,.13);
  --sh-s:0 1px 2px rgba(0,0,0,.5);
  --sh-m:0 4px 10px rgba(0,0,0,.45), 0 16px 40px rgba(0,0,0,.35);
  --sh-in:inset 0 1px 0 rgba(255,255,255,.04);
  --grad:linear-gradient(160deg,#202528 0%,#171A1D 100%);
  --grad-brand:linear-gradient(145deg,#2E9E63 0%,#1B6B43 100%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
  min-height:100dvh;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 44px);
  transition:background .25s,color .25s;
  background-image:radial-gradient(90% 40% at 50% -5%, var(--tint) 0%, transparent 70%);
}
.wrap{max-width:760px;margin:0 auto}

/* ============ header ============ */
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.mark{width:46px;height:46px;border-radius:15px;background:var(--surf);border:1px solid var(--line);flex:none;
  display:grid;place-items:center;box-shadow:var(--sh-m),var(--sh-in);overflow:hidden}
.mark img{width:100%;height:100%;object-fit:cover}
.who{flex:1;min-width:0}
.who .brand{font-size:11px;letter-spacing:2.4px;text-transform:uppercase;color:var(--ink3);font-weight:700}
.who h1{font-size:20px;font-weight:750;letter-spacing:-.4px;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--surf);
  color:var(--ink2);font-size:17px;cursor:pointer;box-shadow:var(--sh-s);flex:none;transition:.18s}
.tbtn:hover{border-color:var(--line2);transform:translateY(-1px)}

/* ============ controles ============ */
.row1{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:13px;font-weight:650;
  padding:7px 13px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.16s}
.seg button[aria-pressed="true"]{background:var(--surf);color:var(--ink);box-shadow:var(--sh-s)}
.spacer{flex:1}
.pill{font-size:11px;font-weight:700;padding:6px 11px;border-radius:99px;background:var(--tint);
  color:var(--in);border:1px solid var(--line);white-space:nowrap}

.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;background:var(--bg2);border:1px solid var(--line);
  border-radius:15px;padding:4px;margin-bottom:14px}
.tabs button{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:14.5px;font-weight:700;
  padding:11px;border-radius:11px;cursor:pointer;transition:.18s}
.tabs button[aria-selected="true"]{background:var(--grad);color:var(--ink);box-shadow:var(--sh-s),var(--sh-in)}

.periodo{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
.periodo::-webkit-scrollbar{display:none}
.periodo button{flex:none;border:1px solid var(--line);background:var(--surf);color:var(--ink2);
  font:inherit;font-size:12.5px;font-weight:650;padding:8px 13px;border-radius:99px;cursor:pointer;
  box-shadow:var(--sh-s);transition:.16s}
.periodo button:hover{border-color:var(--line2)}
.periodo button[aria-pressed="true"]{background:var(--grad-brand);color:#fff;border-color:transparent;
  box-shadow:0 4px 12px rgba(27,122,70,.28)}
.rango{display:flex;align-items:center;gap:9px;margin:10px 0 16px;flex-wrap:wrap}
.rango .txt{font-size:13px;color:var(--ink2);font-weight:600}
.rango .txt b{color:var(--ink);font-weight:750}
.custom{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
  border:1px solid var(--line);background:var(--surf);color:var(--ink2);font:inherit;font-size:13.5px;
  font-weight:650;padding:12px 15px;border-radius:14px;cursor:pointer;box-shadow:var(--sh-s);
  margin-bottom:14px;transition:.16s}
.custom:hover{border-color:var(--line2)}
.custom.on{background:var(--grad-brand);color:#fff;border-color:transparent;margin-bottom:9px;
  box-shadow:0 4px 14px rgba(27,122,70,.28)}
.custom .cv{font-size:10px;opacity:.7}
.fechas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px;
  background:var(--surf2);border:1px solid var(--line);border-radius:14px;padding:12px}
.fechas label{display:flex;flex-direction:column;gap:5px;min-width:0;font-size:11px;font-weight:700;
  letter-spacing:.6px;text-transform:uppercase;color:var(--ink3)}
.fechas input{border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:10px;
  padding:10px 8px;font:inherit;font-size:14px;width:100%;min-width:0;max-width:100%;
  -webkit-appearance:none;appearance:none;text-align:center}
.fechas input:focus{outline:none;border-color:var(--in)}

/* ============ kpis ============ */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px}
.kpi{background:var(--grad);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;
  box-shadow:var(--sh-m),var(--sh-in);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;border-radius:99px}
.kpi.i::after{background:linear-gradient(90deg,var(--in),transparent)}
.kpi.g::after{background:linear-gradient(90deg,var(--out),transparent)}
.kpi.b::after{background:linear-gradient(90deg,var(--gold),transparent)}
.kpi.wide{grid-column:1/-1}
.kpi .lbl{font-size:10.5px;font-weight:750;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);
  display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:3px;flex:none}
.kpi .val{font-size:var(--vs,26px);font-weight:800;letter-spacing:-.8px;margin-top:9px;
  font-variant-numeric:tabular-nums;white-space:nowrap;max-width:100%;overflow:hidden}
.kpi .sub{font-size:12px;color:var(--ink3);margin-top:5px}
button.kpi{display:block;width:100%;text-align:left;font:inherit;cursor:pointer;color:var(--ink)}
.kpi .ver{margin-top:8px;font-size:11.5px;font-weight:700;color:var(--ink3)}
.tipos{display:flex;width:100%;margin-bottom:10px}
.tipos button{flex:1}
.pos{color:var(--in)} .neg{color:var(--out)}

/* ============ cards ============ */
.card{background:var(--grad);border:1px solid var(--line);border-radius:var(--r);padding:17px;
  margin-bottom:14px;box-shadow:var(--sh-m),var(--sh-in)}
.card h2{font-size:15px;font-weight:750;letter-spacing:-.2px}
.card .cap{font-size:12px;color:var(--ink3);margin-top:3px;margin-bottom:14px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink2);margin-bottom:8px;font-weight:600}
.legend span{display:flex;align-items:center;gap:6px}

/* ============ chart ============ */
.plot{position:relative}
svg.chart{display:block;width:100%;height:215px;overflow:visible;touch-action:pan-y}
.axis{fill:var(--ink3);font-size:11px;font-weight:600}
.barlbl{font-size:11px;font-weight:750}
.gridline{stroke:var(--line);stroke-width:1}
rect.bar{transition:opacity .15s}
g.grp.dim rect.bar{opacity:.35}
.tip{position:absolute;pointer-events:none;background:var(--surf);border:1px solid var(--line2);
  border-radius:12px;padding:9px 11px;box-shadow:var(--sh-m);font-size:12px;min-width:140px;
  opacity:0;transform:translate(-50%,-100%);transition:opacity .12s;z-index:5;touch-action:none}
.tip.on{opacity:1}
.tip b{display:block;font-size:12px;margin-bottom:6px;color:var(--ink)}
.tip .l{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--ink2);margin-top:3px}
.tip .l i{width:7px;height:7px;border-radius:2px;display:inline-block;margin-right:5px}
.tip .l b{display:inline;font-variant-numeric:tabular-nums;font-size:12px;margin:0}

/* ============ categorias ============ */
.cat{display:flex;align-items:center;gap:11px;padding:10px 8px;cursor:pointer;border-radius:12px;transition:.15s}
.cat:hover{background:var(--surf2)}
.cat .nm{font-size:13.5px;font-weight:650;width:36%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .track{flex:1;height:10px;border-radius:99px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.cat .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--in),var(--brand))}
.cat .amt{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.cat .go{color:var(--ink3);font-size:13px}

/* ============ movimientos ============ */
.search{width:100%;background:var(--surf2);border:1px solid var(--line);color:var(--ink);border-radius:13px;
  padding:12px 14px;font:inherit;font-size:14px;margin-bottom:11px;box-shadow:var(--sh-s)}
.search::placeholder{color:var(--ink3)}
.search:focus{outline:none;border-color:var(--in)}
.filtros{display:flex;gap:8px;margin-bottom:12px}
.filtros button{flex:1;border:1px solid var(--line);background:var(--surf);color:var(--ink2);font:inherit;
  font-size:13px;font-weight:650;padding:10px 12px;border-radius:12px;cursor:pointer;
  box-shadow:var(--sh-s);display:flex;align-items:center;justify-content:center;gap:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filtros button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filtros .abre{flex:1.6}
.filtros .abre .cv{opacity:.6;font-size:11px}

/* hoja de categorias */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;
  justify-content:center;z-index:50;padding:0}
.hoja{width:100%;max-width:760px;background:var(--bg);border-radius:20px 20px 0 0;
  border:1px solid var(--line);border-bottom:0;box-shadow:var(--sh-m);
  padding:8px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:76dvh;
  display:flex;flex-direction:column;animation:sube .22s ease-out}
@keyframes sube{from{transform:translateY(22px);opacity:.4}to{transform:none;opacity:1}}
.hoja .asa{width:38px;height:4px;border-radius:99px;background:var(--line2);margin:6px auto 12px}
.hoja h3{font-size:16px;font-weight:800;letter-spacing:-.2px;margin-bottom:2px}
.hoja .cap{margin-bottom:10px}
.hoja .lista{overflow-y:auto;-webkit-overflow-scrolling:touch}
.opt{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-size:14.5px;
  font-weight:650;padding:12px 14px;border-radius:13px;margin-bottom:7px;cursor:pointer;text-align:left}
.opt small{font-size:12px;font-weight:650;color:var(--ink3)}
.opt[aria-pressed="true"]{background:var(--grad-brand);color:#fff;border-color:transparent}
.opt[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.hoja .listo{margin-top:10px;width:100%;border:0;border-radius:13px;background:var(--grad-brand);
  color:#fff;font:inherit;font-size:15px;font-weight:750;padding:13px;cursor:pointer;
  box-shadow:0 4px 14px rgba(27,122,70,.28)}
.mv{border:1px solid var(--line);border-radius:15px;margin-bottom:9px;overflow:hidden;background:var(--surf);
  box-shadow:var(--sh-s)}
.mv[open]{border-color:var(--line2)}
.mv summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer}
.mv summary::-webkit-details-marker{display:none}
.ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:15px;flex:none;font-weight:800}
.mv .t{flex:1;min-width:0}
.mv .t b{display:block;font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .t small{color:var(--ink3);font-size:11.5px}
.mv .v{font-size:14.5px;font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}
.det{padding:0 14px 14px 62px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:12.5px;
  border-top:1px solid var(--line);margin-top:2px;padding-top:12px}
.det dt{color:var(--ink3);font-weight:600} .det dd{color:var(--ink2)}
.more{width:100%;border:1px dashed var(--line2);background:transparent;color:var(--ink2);border-radius:13px;
  padding:12px;font:inherit;font-size:13px;font-weight:650;cursor:pointer}

/* ============ estados ============ */
.center{text-align:center;padding:48px 20px}
.center .big{font-size:46px;margin-bottom:12px}
.center h2{font-size:20px;margin-bottom:8px;font-weight:750}
.center p{color:var(--ink2);font-size:14.5px;line-height:1.55;max-width:370px;margin:0 auto}
.btn{display:inline-block;margin-top:18px;background:var(--grad-brand);color:#fff;border:0;border-radius:13px;
  padding:13px 22px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;
  box-shadow:0 6px 18px rgba(27,122,70,.3)}
.btn.ghost{background:var(--surf);color:var(--ink2);border:1px solid var(--line);box-shadow:var(--sh-s)}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--in);border-radius:50%;
  margin:0 auto 16px;animation:s .9s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.note{text-align:center;color:var(--ink3);font-size:11.5px;margin-top:14px;line-height:1.6}
.empty{text-align:center;color:var(--ink3);font-size:13.5px;padding:26px 0}
@media(min-width:600px){ .kpis{grid-template-columns:repeat(3,1fr)} .kpi.wide{grid-column:auto} }

/* ===== Calendario ===== */
#cal .ch{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px}
#cal .ch b{font-size:17px;font-weight:750;letter-spacing:-.3px}
#cal .nv{border:1px solid var(--line);background:var(--surf);color:var(--ink);width:36px;height:36px;border-radius:12px;font-size:17px;cursor:pointer}
#cal .gr{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:16px}
#cal .dw{font-size:11px;font-weight:700;color:var(--ink3);text-align:center;padding:4px 0}
#cal .dc{aspect-ratio:1;border:1px solid transparent;background:var(--surf);border-radius:12px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:var(--sh-s)}
#cal .dc.v{background:transparent;box-shadow:none;cursor:default}
#cal .dc.hoy{border-color:var(--brand)}
#cal .dc.sel{background:var(--brand);color:#fff}
#cal .dc u{position:absolute;bottom:5px;display:flex;gap:3px;text-decoration:none}
#cal .dc u i{width:5px;height:5px;border-radius:50%}
#cal .dc i.r{background:#FFC700}
#cal .dc i.g{background:var(--in)}
#cal .dc i.e{background:#E0604F}
#cal .dc i.h{opacity:.35}
#cal .dc.sel u i{box-shadow:0 0 0 1px #fff}
#cal .it{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
#cal .it:first-of-type{border-top:0}
#cal .hr{min-width:66px;text-align:center;font-size:12px;font-weight:750;background:#FFE680;color:#5A4500;padding:4px 8px;border-radius:8px}
#cal .tt{flex:1;font-size:14.5px;font-weight:600;min-width:0;overflow-wrap:anywhere}
#cal .tt small{display:block;font-size:11.5px;font-weight:600;color:var(--ink3);margin-top:2px}
#cal .it.h .tt{text-decoration:line-through;color:var(--ink3)}
#cal .ic{border:0;background:var(--bg2);color:var(--ink2);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:14px;flex:none}
#cal .ic.w{width:auto;padding:0 10px;font-size:12px;font-weight:700;color:#B3261E}
#cal .vacio{font-size:14px;color:var(--ink3);padding:6px 0 12px}
#cal .nuevo{width:100%;border:1px dashed var(--line2);background:transparent;color:var(--brand);font:inherit;font-weight:750;font-size:14.5px;padding:13px;border-radius:14px;cursor:pointer;margin-top:6px}
#cal .fi{width:100%;border:1px solid var(--line);background:var(--surf2);color:var(--ink);font:inherit;font-size:16px;padding:12px;border-radius:12px;margin-bottom:10px}
#cal .fr{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
#cal .fb{display:flex;gap:8px}
#cal .fb button{flex:1;border:0;font:inherit;font-weight:750;font-size:14.5px;padding:13px;border-radius:12px;cursor:pointer}
#cal .pri{background:var(--brand);color:#fff}
#cal .sec{background:var(--bg2);color:var(--ink2)}
#cal .err{color:#B3261E;font-size:13px;margin-bottom:8px}
#cal .lg{display:flex;gap:14px;justify-content:center;font-size:11.5px;color:var(--ink3);margin:-6px 0 16px}
#cal .lg span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:var(--c)}
#cal .sub{font-size:11.5px;font-weight:750;letter-spacing:.4px;text-transform:uppercase;color:var(--ink3);margin:14px 0 2px}
#cal .tot{display:flex;gap:16px;font-size:13px;font-weight:700;margin-bottom:2px}
#cal .mr{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
#cal .mi{width:8px;height:8px;border-radius:50%;flex:none}
#cal .mi.g,#cal .tot .g{background:var(--in)}
#cal .mi.e,#cal .tot .e{background:#E0604F}
#cal .tot .g,#cal .tot .e{background:none}
#cal .tot .g{color:var(--in)}
#cal .tot .e{color:#E0604F}
#cal .mo{font-size:14px;font-weight:750;white-space:nowrap}
#cal .mo.g{color:var(--in)}
#cal .mo.e{color:#E0604F}
#cal .ver{width:100%;border:0;background:var(--bg2);color:var(--ink);font:inherit;font-weight:750;font-size:14.5px;padding:13px;border-radius:14px;cursor:pointer;margin-top:12px}
</style>
</head>
<body data-palette="#1B7A46,#D9A13B">
<div class="wrap" id="app"><div class="center"><div class="spin"></div><p>Cargando tu tablero…</p></div></div>

<script>
const API='https://fnolzmacqnaxcktlxhxx.supabase.co/functions/v1/tablero';
const WA='https://wa.me/16292475517';
const PLANES='https://walle-drab.vercel.app/';
const $=document.getElementById('app');
const T=new URLSearchParams(location.search).get('t');

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Cifras largas (millones) no caben a 26px en media tarjeta: se bajan por longitud.
const talla=t=>{const n=String(t).length; return n<=10?26:n<=12?23:n<=14?20:n<=16?18:16;};
const nf=(n,m)=>new Intl.NumberFormat('es-CO',{style:'currency',currency:m||'COP',maximumFractionDigits:0}).format(n);
const corto=n=>{const a=Math.abs(n);
  if(a>=1e9)return (n/1e9).toFixed(1).replace('.0','')+'B';
  if(a>=1e6)return (n/1e6).toFixed(1).replace('.0','')+'M';
  if(a>=1e3)return Math.round(n/1e3)+'k'; return String(Math.round(n));};
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fmtDia=f=>{const[y,m,d]=f.split('-').map(Number);return `${d} ${MES[m-1]} ${y}`;};
const BANDERA={COP:'🇨🇴',USD:'🇺🇸',EUR:'🇪🇺',MXN:'🇲🇽',ARS:'🇦🇷',CLP:'🇨🇱',PEN:'🇵🇪',BRL:'🇧🇷'};

const S={data:null,tab:'resumen',periodo:'mes',desde:'',hasta:'',moneda:'COP',cats:[],tipo:'',q:'',tope:15,tema:'light'};
try{const t=localStorage.getItem('walle_tema'); if(t)S.tema=t;}catch(e){}
function aplicarTema(){
  document.documentElement.dataset.theme=S.tema;
  const mt=document.querySelector('meta[name="theme-color"]');
  if(mt)mt.setAttribute('content',S.tema==='dark'?'#0F1113':'#F6F4EE');
  try{localStorage.setItem('walle_tema',S.tema)}catch(e){}
}

const hoy=new Date();
const iso=d=>d.toISOString().slice(0,10);
function rango(){
  const y=hoy.getFullYear(), m=hoy.getMonth();
  if(S.periodo==='mes')    return [iso(new Date(Date.UTC(y,m,1))),   iso(new Date(Date.UTC(y,m+1,0)))];
  if(S.periodo==='pasado') return [iso(new Date(Date.UTC(y,m-1,1))), iso(new Date(Date.UTC(y,m,0)))];
  if(S.periodo==='ytd')    return [iso(new Date(Date.UTC(y,0,1))),   iso(new Date(Date.UTC(y,m+1,0)))];
  if(S.periodo==='custom') return [S.desde||'', S.hasta||'9999-12-31'];
  return ['','9999-12-31'];
}
function etiquetaRango(){
  const y=hoy.getFullYear(), m=hoy.getMonth();
  if(S.periodo==='mes')    return `${MESL[m][0].toUpperCase()+MESL[m].slice(1)} ${y}`;
  if(S.periodo==='pasado'){const d=new Date(Date.UTC(y,m-1,1));
    return `${MESL[d.getUTCMonth()][0].toUpperCase()+MESL[d.getUTCMonth()].slice(1)} ${d.getUTCFullYear()}`;}
  if(S.periodo==='ytd')    return `1 ene – ${hoy.getDate()} ${MES[m]} ${y}`;
  if(S.periodo==='custom'){
    if(!S.desde&&!S.hasta) return 'Elige tus fechas';
    return `${S.desde?fmtDia(S.desde):'inicio'} – ${S.hasta?fmtDia(S.hasta):'hoy'}`;}
  return 'Todo tu historial';
}
function filtrados(conCat=true){
  const [a,b]=rango();
  return S.data.movimientos.filter(m=>
    m.moneda===S.moneda && (!a||m.fecha>=a) && m.fecha<=b &&
    (!conCat||!S.cats.length||S.cats.includes(m.categoria)) &&
    (!conCat||!S.tipo||m.tipo===S.tipo) &&
    (!S.q||(m.comercio+' '+m.descripcion+' '+m.categoria+' '+m.evento).toLowerCase().includes(S.q)));
}

/* ================= gráfico ================= */
function chartMeses(movs){
  const map=new Map();
  for(const m of movs){
    const k=m.fecha.slice(0,7); const o=map.get(k)||{in:0,out:0};
    o[m.tipo==='ingreso'?'in':'out']+=m.valor; map.set(k,o);
  }
  const keys=[...map.keys()].sort().slice(-6);
  if(!keys.length) return '<div class="empty">Sin movimientos en este periodo.</div>';
  const max=Math.max(...keys.map(k=>Math.max(map.get(k).in,map.get(k).out)))||1;
  const W=340,H=180,pad=24,base=138,alto=98;
  const gw=(W-pad*2)/keys.length, bw=Math.min(28,gw/2.9), sep=4;
  let g='';
  keys.forEach((k,i)=>{
    const o=map.get(k), cx=pad+gw*i+gw/2;
    const hi=Math.max(3,o.in/max*alto), ho=Math.max(3,o.out/max*alto);
    const [yy,mm]=k.split('-'); const bal=o.in-o.out;
    g+=`<g class="grp" data-i="${i}" data-k="${k}" data-in="${o.in}" data-out="${o.out}" data-cx="${cx}">
      <rect x="${cx-gw/2}" y="14" width="${gw}" height="${base-14}" fill="transparent"/>
      <rect class="bar" x="${cx-bw-sep/2}" y="${base-hi}" width="${bw}" height="${hi}" rx="5" fill="var(--in)"/>
      <rect class="bar" x="${cx+sep/2}" y="${base-ho}" width="${bw}" height="${ho}" rx="5" fill="var(--out)"/>
      <text class="axis" x="${cx}" y="${base+16}" text-anchor="middle">${MES[+mm-1]}</text>
      <text class="barlbl" x="${cx}" y="${base-Math.max(hi,ho)-8}" text-anchor="middle"
        fill="${bal>=0?'var(--in)':'var(--out)'}">${bal>=0?'+':'−'}${corto(Math.abs(bal))}</text></g>`;
  });
  return `<div class="plot">
    <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" id="svgm"
      role="img" aria-label="Ingresos y gastos por mes">
      <line class="gridline" x1="${pad-8}" y1="${base}" x2="${W-pad+8}" y2="${base}"/>${g}</svg>
    <div class="tip" id="tip"></div></div>`;
}
function armarTooltip(){
  const svg=document.getElementById('svgm'), tip=document.getElementById('tip');
  if(!svg||!tip)return;
  const grupos=[...svg.querySelectorAll('.grp')];
  let fijo=null;
  const pintar=g=>{
    grupos.forEach(x=>x.classList.toggle('dim',x!==g));
    const k=g.dataset.k, i=+g.dataset.in, o=+g.dataset.out, bal=i-o;
    const [yy,mm]=k.split('-');
    tip.innerHTML=`<b>${MESL[+mm-1]} ${yy}</b>
      <div class="l"><span><i style="background:var(--in)"></i>Ingresos</span><b>${nf(i,S.moneda)}</b></div>
      <div class="l"><span><i style="background:var(--out)"></i>Gastos</span><b>${nf(o,S.moneda)}</b></div>
      <div class="l"><span>Balance</span><b style="color:${bal>=0?'var(--in)':'var(--out)'}">${bal>=0?'+':'−'}${nf(Math.abs(bal),S.moneda)}</b></div>`;
    // posicion real de la barra, no un estimado: se mide en pantalla
    const barra=g.querySelector('rect.bar');
    const rb=barra.getBoundingClientRect(), rp=tip.parentNode.getBoundingClientRect();
    const ancho=tip.offsetWidth||150;
    let x=rb.left-rp.left+rb.width;
    x=Math.max(ancho/2+4, Math.min(rp.width-ancho/2-4, x));
    tip.style.left=x+'px';
    tip.style.top=Math.max(4, rb.top-rp.top-8)+'px';
    tip.classList.add('on');
  };
  const limpiar=()=>{fijo=null;grupos.forEach(x=>x.classList.remove('dim'));tip.classList.remove('on')};
  grupos.forEach(g=>{
    g.addEventListener('mouseenter',()=>{if(!fijo)pintar(g)});
    g.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse')return;
      e.preventDefault();
      if(fijo===g){limpiar();}else{fijo=g;pintar(g);}
    });
  });
  svg.addEventListener('mouseleave',()=>{if(!fijo)limpiar()});
  document.addEventListener('pointerdown',e=>{ if(fijo&&!svg.contains(e.target))limpiar(); },true);
}
function listaCategorias(movs){
  const map=new Map();
  for(const m of movs){ if(m.tipo!=='egreso')continue;
    map.set(m.categoria,(map.get(m.categoria)||0)+m.valor); }
  const arr=[...map.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8);
  if(!arr.length) return '<div class="empty">Aún no hay gastos en este periodo.</div>';
  const max=arr[0][1], tot=arr.reduce((s,[,v])=>s+v,0);
  return arr.map(([c,v])=>`<div class="cat" data-cat="${esc(c)}" role="button" tabindex="0">
      <div class="nm">${esc(c)}</div>
      <div class="track"><div class="fill" style="width:${Math.max(6,v/max*100)}%"></div></div>
      <div class="amt">${nf(v,S.moneda)} · ${Math.round(v/tot*100)}%</div>
      <div class="go">›</div></div>`).join('');
}

function listaMovs(movs){
  if(!movs.length) return '<div class="empty">Nada por aquí con esos filtros.</div>';
  const vis=movs.slice(0,S.tope);
  const html=vis.map(m=>{
    const ing=m.tipo==='ingreso';
    const col=ing?'var(--in)':'var(--out)';
    return `<details class="mv"><summary>
      <div class="ic" style="background:var(--tint);color:${col}">${ing?'↑':'↓'}</div>
      <div class="t"><b>${esc(m.comercio||m.descripcion||m.categoria)}</b>
        <small>${fmtDia(m.fecha)} · ${esc(m.categoria)}</small></div>
      <div class="v" style="color:${col}">${ing?'+':'−'}${nf(m.valor,m.moneda)}</div></summary>
      <dl class="det">
        <dt>Tipo</dt><dd>${ing?'Ingreso':'Gasto'}</dd>
        <dt>Categoría</dt><dd>${esc(m.categoria)}</dd>
        ${m.evento&&m.evento!=='Diario'?`<dt>Evento</dt><dd>${esc(m.evento)}</dd>`:''}
        ${m.descripcion?`<dt>Detalle</dt><dd>${esc(m.descripcion)}</dd>`:''}
        ${m.medio?`<dt>Medio</dt><dd>${esc(m.medio)}</dd>`:''}
        ${m.hora?`<dt>Hora</dt><dd>${esc(m.hora)}</dd>`:''}
      </dl></details>`;
  }).join('');
  const resto=movs.length-vis.length;
  return html+(resto>0?`<button class="more" id="more">Ver ${resto} movimiento${resto===1?'':'s'} más</button>`:'');
}

// Hoja de categorias: muestra TODAS las del periodo, incluidas las que el usuario invento.
function abrirCategorias(lista){
  const cuenta=new Map();
  lista.forEach(m=>cuenta.set(m.categoria,(cuenta.get(m.categoria)||0)+1));
  const cats=[...cuenta.keys()].sort((a,b)=>cuenta.get(b)-cuenta.get(a)||a.localeCompare(b,'es'));
  const velo=document.createElement('div'); velo.className='velo';
  velo.innerHTML=`<div class="hoja" role="dialog" aria-modal="true" aria-label="Filtrar por categoría">
    <div class="asa"></div>
    <h3>Filtrar por categoría</h3>
    <p class="cap">Estas son las categorías que has usado en este periodo.</p>
    <div class="lista">
      <button class="opt" data-c="" aria-pressed="${!S.cats.length}">
        <span>Todas</span><small>${lista.length}</small></button>
      ${cats.map(c=>`<button class="opt" data-c="${esc(c)}" aria-pressed="${S.cats.includes(c)}">
        <span>${esc(c)}</span><small>${cuenta.get(c)}</small></button>`).join('')}
    </div>
    <button class="listo" id="listo">Listo</button>
  </div>`;
  const cerrar=()=>velo.remove();
  velo.onclick=e=>{ if(e.target===velo){ S.tope=15; cerrar(); render(); } };
  const pinta=()=>{
    velo.querySelectorAll('.opt').forEach(b=>{
      const c=b.dataset.c;
      b.setAttribute('aria-pressed', c? S.cats.includes(c) : !S.cats.length);
    });
    const et=velo.querySelector('#listo');
    et.textContent = S.cats.length? `Ver ${S.cats.length} categoría${S.cats.length===1?'':'s'}` : 'Ver todas';
  };
  velo.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const c=b.dataset.c;
    if(!c){ S.cats=[]; }
    else { const i=S.cats.indexOf(c); i<0? S.cats.push(c) : S.cats.splice(i,1); }
    pinta();
  });
  velo.querySelector('#listo').onclick=()=>{ S.tope=15; cerrar(); render(); };
  pinta();
  document.addEventListener('keydown',function esc2(e){
    if(e.key==='Escape'){cerrar();document.removeEventListener('keydown',esc2)} });
  document.body.appendChild(velo);
}

    `<button class="btn" onclick="location.reload()">Reintentar</button>`); }
  if(!d.ok){
    if(d.error==='sin_vistas') return pantalla('✨','Se acabaron tus vistas gratis',
      'Con un plan activo abres tu tablero cuando quieras, sin contador.',
      `<a class="btn" href="${PLANES}?t=${encodeURIComponent(T)}">Ver planes</a>
       <a class="btn ghost" href="${WA}">Volver a WhatsApp</a>`);
    if(d.error==='sin_google') return pantalla('🔗','Falta conectar tu Drive',
      'Conecta tu Google Drive desde WhatsApp y vuelve a abrir el tablero.',`<a class="btn" href="${WA}">Ir a WhatsApp</a>`);
    if(d.error==='enlace_vencido') return pantalla('⏳','Tu enlace venció',
      'Escríbele «tablero» a Walle y te manda uno nuevo.',`<a class="btn" href="${WA}">Pedir enlace nuevo</a>`);
    return pantalla('⚠️','Algo salió mal', d.mensaje||'Intenta de nuevo en un momento.',
      `<button class="btn" onclick="location.reload()">Reintentar</button>`);
  }
  if(!d.movimientos.length) return pantalla('🌱','Tu tablero está listo',
    'Registra tu primer gasto en WhatsApp y aquí verás tus números.',
    `<a class="btn" href="${WA}">Registrar mi primer gasto</a>`);
  S.data=d;
  const cuenta={}; d.movimientos.forEach(m=>cuenta[m.moneda]=(cuenta[m.moneda]||0)+1);
  S.moneda=Object.entries(cuenta).sort((a,b)=>b[1]-a[1])[0][0];
  render();
})();

/* ===== Calendario (recordatorios) ===== */
const REC='https://fnolzmacqnaxcktlxhxx.supabase.co/functions/v1/rec-api';
const C={items:[],ok:false,cargando:false,intento:false,mes:null,sel:null,form:null,conf:null,msg:''};
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const pad2=n=>String(n).padStart(2,'0');
const bog=()=>new Date(Date.now()-5*3600e3);
const ymd=d=>d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate());
const hora12=h=>{const [H,M]=h.split(':').map(Number);return ((H%12)||12)+':'+pad2(M)+' '+(H<12?'a.m.':'p.m.')};
const fechaLarga=f=>{const [y,m,d]=f.split('-').map(Number);return DIAS[new Date(Date.UTC(y,m-1,d)).getUTCDay()]+' '+d+' de '+MESES[m-1].toLowerCase()};
async function recApi(accion,extra){
  try{const r=await fetch(REC,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({t:T,accion:accion},extra||{}))});return await r.json();}
  catch(e){return {ok:false,mensaje:'Revisa tu internet e intenta de nuevo.'};}
}
async function calCargar(){
  C.cargando=true;C.intento=true;render();
  const r=await recApi('listar');
  C.cargando=false;
  if(r.ok){C.items=r.items||[];C.ok=true;C.msg='';}else{C.msg=r.mensaje||'No pudimos cargar tus recordatorios.';}
  render();
}
function filaHTML(it){
  const hecho=it.estado==='hecho';
  const nota=it.estado==='enviado'?'<small>Aviso enviado</small>':'';
  const borrar=C.conf===it.id?'<button class="ic w" data-a="borrar" data-id="'+it.id+'">¿Borrar?</button>':'<button class="ic" data-a="pedirborrar" data-id="'+it.id+'" aria-label="Borrar">🗑</button>';
  return '<div class="it'+(hecho?' h':'')+'"><span class="hr">'+hora12(it.hora)+'</span><span class="tt">'+esc(it.titulo)+nota+'</span>'
    +(hecho?'':'<button class="ic" data-a="hecho" data-id="'+it.id+'" aria-label="Marcar como hecho">✓</button><button class="ic" data-a="editar" data-id="'+it.id+'" aria-label="Editar">✎</button>')
    +borrar+'</div>';
}
function formHTML(){
  const f=C.form;
  return '<div class="card"><h2>'+(f.id?'Editar recordatorio':'Nuevo recordatorio')+'</h2><div class="cap">Walle te lo escribe por WhatsApp ese día.</div>'
   +(f.err?'<div class="err">'+esc(f.err)+'</div>':'')
   +'<input class="fi" id="f-t" maxlength="80" placeholder="¿Qué quieres recordar?" value="'+esc(f.titulo)+'">'
   +'<div class="fr"><input class="fi" id="f-f" type="date" min="'+ymd(bog())+'" value="'+esc(f.fecha)+'"><input class="fi" id="f-h" type="time" value="'+esc(f.hora)+'"></div>'
   +'<div class="fb"><button class="sec" data-a="cancelar">Cancelar</button><button class="pri" data-a="guardar">Guardar</button></div></div>';
}
const calMonto=v=>(S.moneda==='COP'?'$':S.moneda+' ')+Math.round(Number(v)||0).toLocaleString('es-CO');
function puntos(L,M){
  const a=[];
  if(L.length)a.push('<i class="r'+(L.some(i=>i.estado!=='hecho')?'':' h')+'"></i>');
  if(M.some(m=>m.tipo==='ingreso'))a.push('<i class="g"></i>');
  if(M.some(m=>m.tipo==='egreso'))a.push('<i class="e"></i>');
  return a.length?'<u>'+a.join('')+'</u>':'';
}
function movsDiaHTML(M){
  if(!M.length)return '<div class="sub">Movimientos</div><div class="vacio">Sin movimientos este día.</div>';
  let ing=0,egr=0;M.forEach(m=>{if(m.tipo==='ingreso')ing+=Number(m.valor)||0;else egr+=Number(m.valor)||0;});
  return '<div class="sub">Movimientos</div><div class="tot">'+(ing?'<span class="g">+ '+calMonto(ing)+'</span>':'')+(egr?'<span class="e">− '+calMonto(egr)+'</span>':'')+'</div>'
    +M.map(m=>{const g=m.tipo==='ingreso';return '<div class="mr"><span class="mi '+(g?'g':'e')+'"></span><span class="tt">'+esc(m.comercio||m.categoria||'Movimiento')+'<small>'+esc(m.categoria||'')+'</small></span><b class="mo '+(g?'g':'e')+'">'+(g?'+':'−')+calMonto(m.valor)+'</b></div>';}).join('');
}
function calHTML(){
  const hoy=ymd(bog());
  if(!C.mes){const b=bog();C.mes=[b.getUTCFullYear(),b.getUTCMonth()];}
  const [y,m]=C.mes;
  const vivos=C.items.filter(i=>i.estado!=='cancelado');
  const porDia={};vivos.forEach(i=>{(porDia[i.fecha]=porDia[i.fecha]||[]).push(i);});
  const mv={};((S.data&&S.data.movimientos)||[]).forEach(m=>{if(m.moneda!==S.moneda)return;const f=String(m.fecha).slice(0,10);(mv[f]=mv[f]||[]).push(m);});
  const lead=(new Date(Date.UTC(y,m,1)).getUTCDay()+6)%7;
  const n=new Date(Date.UTC(y,m+1,0)).getUTCDate();
  let g='<div class="gr">'+['L','M','M','J','V','S','D'].map(d=>'<div class="dw">'+d+'</div>').join('');
  for(let i=0;i<lead;i++)g+='<div class="dc v"></div>';
  for(let d=1;d<=n;d++){
    const f=y+'-'+pad2(m+1)+'-'+pad2(d), L=porDia[f]||[];
    const pend=L.some(i=>i.estado!=='hecho');
    g+='<button class="dc'+(f===hoy?' hoy':'')+(f===C.sel?' sel':'')+'" data-a="dia" data-f="'+f+'">'+d+puntos(L,mv[f]||[])+'</button>';
  }
  g+='</div><div class="lg"><span style="--c:#FFC700">Recordatorio</span><span style="--c:var(--in)">Ingreso</span><span style="--c:#E0604F">Egreso</span></div>';
  let h='<div id="cal"><div class="ch"><button class="nv" data-a="prev" aria-label="Mes anterior">‹</button><b>'+MESES[m]+' '+y+'</b><button class="nv" data-a="next" aria-label="Mes siguiente">›</button></div>'+g;
  if(C.msg)h+='<div class="err">'+esc(C.msg)+'</div>';
  if(C.form){h+=formHTML();}
  else{
    let titulo,lista;
    if(C.sel){titulo=fechaLarga(C.sel);lista=porDia[C.sel]||[];}
    else{titulo='Próximos';lista=vivos.filter(i=>i.estado!=='hecho'&&(i.fecha+'T'+i.hora)>=(hoy+'T00:00')).slice(0,6);}
    h+='<div class="card"><h2>'+titulo+'</h2><div class="cap">'+(C.sel?'Resumen del día':(C.cargando&&!C.ok?'Cargando…':lista.length+' recordatorio'+(lista.length===1?'':'s')))+'</div>'
      +(C.sel?movsDiaHTML(mv[C.sel]||[])+'<div class="sub">Recordatorios</div>':'')
      +(lista.length?lista.map(filaHTML).join(''):'<div class="vacio">'+(C.sel?'Nada para este día.':'No tienes recordatorios próximos.')+'</div>')
      +'<button class="nuevo" data-a="nuevo">+ Nuevo recordatorio</button>'+(C.sel&&(mv[C.sel]||[]).length?'<button class="ver" data-a="vermov">Ver en Movimientos →</button>':'')+'</div>';
  }
  return h+'</div>';
}
function calEventos(p){
  p.onclick=async e=>{
    const b=e.target.closest('[data-a]');if(!b)return;
    const a=b.dataset.a,id=b.dataset.id;
    if(a==='prev'||a==='next'){let [y,m]=C.mes;m+=a==='next'?1:-1;if(m<0){m=11;y--;}if(m>11){m=0;y++;}C.mes=[y,m];C.sel=null;C.conf=null;return render();}
    if(a==='dia'){C.sel=C.sel===b.dataset.f?null:b.dataset.f;C.conf=null;return render();}
    if(a==='vermov'&&C.sel){S.tab='movs';S.periodo='custom';S.desde=C.sel;S.hasta=C.sel;S.tope=15;return render();}
    if(a==='nuevo'){C.form={id:'',titulo:'',fecha:C.sel||ymd(bog()),hora:'09:00',err:''};return render();}
    if(a==='editar'){const it=C.items.find(i=>i.id===id);if(!it)return;C.form={id:it.id,titulo:it.titulo,fecha:it.fecha,hora:it.hora,err:''};return render();}
    if(a==='cancelar'){C.form=null;return render();}
    if(a==='pedirborrar'){C.conf=id;return render();}
    if(a==='hecho'||a==='borrar'){
      C.conf=null;b.disabled=true;
      const r=await recApi(a,{id:id});
      if(!r.ok)C.msg=r.mensaje||'No pudimos guardar. Intenta de nuevo.';else C.msg='';
      return calCargar();
    }
    if(a==='guardar'){
      const f=C.form;
      f.titulo=p.querySelector('#f-t').value.trim();f.fecha=p.querySelector('#f-f').value;f.hora=p.querySelector('#f-h').value;
      if(f.titulo.length<2){f.err='Escribe qué quieres recordar.';return render();}
      if(!f.fecha||!f.hora){f.err='Elige la fecha y la hora.';return render();}
      b.disabled=true;
      const r=await recApi(f.id?'editar':'crear',{id:f.id||undefined,titulo:f.titulo,fecha:f.fecha,hora:f.hora});
      if(!r.ok){f.err=r.mensaje||'No pudimos guardar. Intenta de nuevo.';return render();}
      C.sel=f.fecha;const [yy,mm]=f.fecha.split('-').map(Number);C.mes=[yy,mm-1];C.form=null;C.msg='';
      return calCargar();
    }
  };
}
const _renderBase=render;
render=function(){
  _renderBase();
  if(S.tab!=='cal')return;
  try{
    const tabs=$.querySelector('.tabs');if(!tabs||!tabs.parentNode)return;
    while(tabs.nextSibling)tabs.parentNode.removeChild(tabs.nextSibling);
    const p=document.createElement('div');p.innerHTML=calHTML();
    const panel=p.firstElementChild;tabs.parentNode.appendChild(panel);calEventos(panel);
    if(!C.intento)calCargar();
  }catch(e){console.error('calendario',e);}
};
</script>
